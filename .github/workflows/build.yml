name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Lint shell scripts
        run: |
          brew install shellcheck
          shellcheck -S warning bin/macaqueloader installer/install.sh installer/payload/*.sh installer/payload/live-log.command scripts/*.sh

      - name: Build
        run: scripts/build.sh

      - name: Smoke-test the CLI tarball
        run: |
          mkdir -p /tmp/cli && tar -xzf dist/macaqueloader-*.tar.gz -C /tmp/cli
          /tmp/cli/macaqueloader-*/bin/macaqueloader version
          /tmp/cli/macaqueloader-*/bin/macaqueloader help

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
